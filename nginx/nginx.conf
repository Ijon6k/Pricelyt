events {
    worker_connections 1024;
}

http {
    # Unify frontend + API behind one origin so the browser never makes a
    # cross-origin request (no CORS preflight, no mixed-origin cookies).
    server {
        listen 80;
        server_name _;

        # API → Go service. Path is preserved (/api/...), which matches the
        # Go router's StripPrefix("/api", ...) expectation.
        location /api/ {
            proxy_pass         http://api:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Everything else → Next.js frontend.
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
